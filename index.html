<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Esta es la etiqueta clave para la responsividad en móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Responsive</title>
  <style>
    /* Resetea los márgenes y evita dobles barras de desplazamiento */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; 
    }
   
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbzXbFBBtLBOmJt49MIWTFPf2xXUcOUAsfW8CTvASLt628lbhv90BYErMfK4xprzOFnYaQ/exec">
  </iframe>
</body>
</html>
