<!DOCTYPE html>
<html>
<head>
  <title>Contenido incrustado</title>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbzXbFBBtLBOmJt49MIWTFPf2xXUcOUAsfW8CTvASLt628lbhv90BYErMfK4xprzOFnYaQ/exec"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>
  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error al intentar habilitar el modo de pantalla completa:', err.message);
        });
    };
  </script>
</body>
</html>
